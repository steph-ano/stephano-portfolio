server.port=8080
spring.application.name=portfolio-backend

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# GitHub API Integration
github.token=${GITHUB_TOKEN:}
github.api.base-url=https://api.github.com
github.default-owner=stephanovaldivia

# Caffeine Cache Configuration
spring.cache.cache-names=projects,projectDetails,cv
spring.cache.caffeine.spec=expireAfterWrite=60m,maximumSize=100

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
